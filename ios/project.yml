name: RoutePilot
options:
  bundleIdPrefix: com.local.routepilot
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

targets:
  RoutePilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RoutePilotTests
    dependencies:
      - target: RoutePilot
    settings:
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_ALLOWED: NO

  RoutePilot:
    type: application
    platform: iOS
    sources:
      - path: RoutePilot
    resources:
      - path: RoutePilot/Assets.xcassets
      - path: RoutePilot/taiping-addresses.jsonl
    settings:
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
          PRODUCT_BUNDLE_IDENTIFIER: com.local.routepilot.ios
          MARKETING_VERSION: "1.1.0"
          CURRENT_PROJECT_VERSION: 9
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        Release:
          CODE_SIGNING_ALLOWED: NO
          PRODUCT_BUNDLE_IDENTIFIER: com.local.routepilot.ios
          MARKETING_VERSION: "1.1.0"
          CURRENT_PROJECT_VERSION: 9
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: RoutePilot/Info.plist
      properties:
        CFBundleDisplayName: RoutePilot
        CFBundleName: RoutePilot
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "9"
        UIRequiredDeviceCapabilities:
          - arm64
        NSCameraUsageDescription: "RoutePilot uses the camera to read parcel labels."
        NSLocationWhenInUseUsageDescription: "RoutePilot uses your location to order stops and follow the route."
        NSPhotoLibraryUsageDescription: "RoutePilot can read a label photo you choose."
        UILaunchScreen: {}
        UIBackgroundModes: []
      minimizeVersioning: true
